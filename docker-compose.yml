version: '3.8'

services:
  # --- 1. TU APLICACIÓN (NEXT.JS) ---
  app:
    build: .
    container_name: mi_proyecto_app
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      # Conexión a la BD
      - DATABASE_URL=postgresql://postgres:password123@db:5432/mi_portafolio_db
      - HOSTNAME=0.0.0.0
    volumes:
      - .:/app            # Sincroniza tu código
      - /app/node_modules # Vol 2: Protege las dependencias de Linux
      - /app/.next        # Vol 3: ¡LA SOLUCIÓN! Protege el build de producción

  # --- 2. LA BASE DE DATOS (POSTGRES) ---
  db:
    image: postgres:15
    container_name: mi_proyecto_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: mi_portafolio_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- 3. PGADMIN (PANEL DE CONTROL) ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: mi_proyecto_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data: