<svg width="120" height="320" viewBox="0 0 120 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="10" width="100" height="300" rx="30" fill="url(#grad)" opacity="0.18"/>
  <g>
    <rect x="30" y="60" width="60" height="18" rx="6" fill="#fff">
      <animate attributeName="width" values="60;90;60" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="60" cy="160" r="18" fill="#00f0ff">
      <animate attributeName="r" values="18;28;18" dur="2s" repeatCount="indefinite"/>
    </circle>
    <rect x="40" y="220" width="40" height="40" rx="8" fill="#9b00ff">
      <animate attributeName="y" values="220;260;220" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="120" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9b00ff"/>
      <stop offset="1" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>
</svg>