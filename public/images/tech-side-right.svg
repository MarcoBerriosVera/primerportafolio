<svg width="100" height="100%" viewBox="0 0 100 1000" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <rect x="10" y="10" width="80" height="980" rx="30" fill="url(#grad)" opacity="0.13"/>
  <g>
    <polyline points="50,960 50,800 80,700 20,600 50,400" stroke="#9b00ff" stroke-width="3" fill="none">
      <animate attributeName="points" values="50,960 50,800 80,700 20,600 50,400;50,940 50,780 80,680 20,580 50,380;50,960 50,800 80,700 20,600 50,400" dur="3s" repeatCount="indefinite"/>
    </polyline>
    <circle cx="50" cy="880" r="12" fill="#00f0ff">
      <animate attributeName="cy" values="880;820;880" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <rect x="30" y="200" width="40" height="40" rx="8" fill="#9b00ff">
      <animate attributeName="y" values="200;100;200" dur="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="100" y2="1000" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9b00ff"/>
      <stop offset="1" stop-color="#00f0ff"/>
    </linearGradient>
  </defs>
</svg>